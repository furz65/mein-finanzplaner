<!DOCTYPE html>
<html>
<head>
    <title>Finanzplaner - Registrieren</title>
    <style>
        body {
            text-align: center;
            background-color: lightblue;
            font-family: sans-serif;
            padding: 20px;
        }
        .nav-bar {
            background-color: #34495e;
            padding: 10px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
        .box {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 4px;
            display: block;
            width: 250px;
        }
        label {
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">Login</a>
        <a href="Registrirung.html">Registrieren</a>
        <a href="Übersicht.html">Übersicht</a>
    </div>

    <h1>Neues Konto erstellen</h1>
    <h2>Werde Teil des Finanzplaners.</h2>

    <form id="registerForm" class="box">
        
        <label for="new-username">Wunsch-Nutzername</label>
        <input type="text" id="new-username" placeholder="z.B. FinanzProfi99" required>

        <label for="new-email">E-Mail Adresse</label>
        <input type="email" id="new-email" placeholder="Deine E-Mail" required>

        <label for="new-password">Passwort wählen</label>
        <input type="password" id="new-password" placeholder="Sicheres Passwort" required>

        <button type="submit">Konto jetzt erstellen</button>
        
    </form>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, createUserWithEmailAndPassword } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyDAaN0YFzedBQF0eZaEfgQXa9CKVOAFdzc",
            authDomain: "://firebaseapp.com",
            projectId: "mein-finanzplaner",
            storageBucket: "://appspot.com",
            messagingSenderId: "867180240499",
            appId: "1:867180240499:web:043ac6f4654a2a7b465406",
            measurementId: "G-S2DCRB5TPJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let email = document.getElementById('new-email').value;
            let passwort = document.getElementById('new-password').value;

            createUserWithEmailAndPassword(auth, email, passwort)
                .then((userCredential) => {
                    alert('Konto erfolgreich erstellt! Du wirst jetzt zum Login weitergeleitet.');
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    alert('Fehler bei der Registrierung: ' + error.message);
                });
        });
    </script>

</body>
</html>
