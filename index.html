<!DOCTYPE html>
<html>
<head>
    <title>Finanzplaner</title>
    <style>
        body {
            text-align: center;
            background-color: lightblue;
            font-family: sans-serif;
            padding: 20px;
        }
        form {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 4px;
            display: block;
            width: 250px;
        }
        label {
            font-weight: bold;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .nav-bar {
            background-color: #34495e;
            padding: 10px;
            margin-bottom: 30px;
            border-radius: 4px;
            text-align: center;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">Login</a>
        <a href="Registrirung.html">Registrieren</a>
        <a href="Übersicht.html">Übersicht</a>
    </div>

    <h1>Mein Finanzplaner</h1>
    <h2>Das Geld immer im Blick.</h2>

    <form id="loginForm">
        
        <label for="username">Benutzername</label>
        <br>
        <input type="text" id="username" placeholder="username" required>
        <br>
        
        <label for="E-Mail">E-Mail Adresse</label>
        <br>
        <input type="email" id="E-Mail" placeholder="E-Mail" required>
        <br>
        
        <label for="password">Passwort</label>
        <br>
        <input type="password" id="password" placeholder="password" required>
        <br>
        
        <button type="submit">Anmelden</button>
        <br>
        
        <a href="Registrirung.html" style="display: block; text-align: center; margin-top: 15px; color: #3498db; text-decoration: none; font-weight: bold;">
            Neuen Nutzer erstellen
        </a>
        
    </form>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyDAaN0YFzedBQF0eZaEfgQXa9CKVOAFdzc",
            authDomain: "://firebaseapp.com",
            projectId: "mein-finanzplaner",
            storageBucket: "://appspot.com",
            messagingSenderId: "867180240499",
            appId: "1:867180240499:web:043ac6f4654a2a7b465406",
            measurementId: "G-S2DCRB5TPJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let email = document.getElementById('E-Mail').value;
            let passwort = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, passwort)
                .then((userCredential) => {
                    let zufallsCode = Math.floor(1000 + Math.random() * 9000);
                    alert('LOGIN SCHRITT 1 ERFOLGREICH!\n\nEinmalcode wurde an deine E-Mail versendet.\nDein Code lautet: ' + zufallsCode);

                    let eingegebenerCode = prompt('Bitte gib den 4-stelligen Einmalcode ein, den du erhalten hast:');

                    if (parseInt(eingegebenerCode) === zufallsCode) {
                        sessionStorage.setItem('istEingeloggt', 'true');
                        alert('Einmalcode korrekt! Willkommen zurück.');
                        window.location.href = 'Übersicht.html'; 
                    } else {
                        alert('Fehler: Falscher Einmalcode! Zugriff verweigert.');
                    }
                })
                .catch((error) => {
                    alert('Fehler beim Login: E-Mail oder Passwort falsch!');
                });
        });
    </script>

</body>
</html>
