<!DOCTYPE html>
<html>
<head>
    <title>Mein Finanzplaner - Übersicht</title>
    <style>
        body {
            text-align: center;
            background-color: lightblue;
            font-family: sans-serif;
            padding: 20px;
        }
        .nav-bar {
            background-color: #34495e;
            padding: 10px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
        .monats-wahrler {
            margin-bottom: 20px;
        }
        .monats-wahrler select {
            display: inline-block;
            width: auto;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 10px;
        }
        .eingabe-box {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: left;
            margin-bottom: 30px;
        }
        input, select {
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 4px;
            display: block;
            width: 220px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .checkbox-container input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
        .kontostand-box {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: white;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        .tabellen-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .tabellen-spalte {
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border-radius: 6px;
            overflow: hidden;
            width: 45%;
            min-width: 360px;
        }
        .tabellen-spalte h3 {
            margin: 0;
            padding: 15px;
            color: white;
        }
        .spalte-plus h3 { background-color: #2ecc71; }
        .spalte-minus h3 { background-color: #e74c3c; }

        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f5f5f5;
            color: #333;
        }
        .plus { color: green; font-weight: bold; }
        .minus { color: red; font-weight: bold; }
        
        .vorkasse-zeile {
            background-color: #fff9db !important;
        }
        .vorkasse-text {
            font-size: 11px;
            color: #f39c12;
            font-weight: bold;
            display: block;
        }
        .edit-input {
            width: 90%;
            padding: 4px;
            margin: 0;
            border: 1px dashed #3498db;
            background-color: #f7f9fa;
            font-size: 14px;
        }
        .btn-delete {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 3px;
        }
        .btn-delete:hover { background-color: #c0392b; }
        
        .btn-confirm {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-confirm:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">Login</a>
        <a href="Registrirung.html">Registrieren</a>
        <a href="Übersicht.html">Übersicht</a>
    </div>

    <h1>Einnahmen & Ausgaben</h1>

    <div class="monats-wahrler">
        <label for="anzeigeMonat"><strong>Aktueller Monat:</strong></label>
        <select id="anzeigeMonat" onchange="rendereTabelle()">
            <option value="Januar">Januar</option>
            <option value="Februar">Februar</option>
            <option value="März">März</option>
            <option value="April">April</option>
            <option value="Mai">Mai</option>
            <option value="Juni">Juni</option>
            <option value="Juli">Juli</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="Oktober">Oktober</option>
            <option value="November">November</option>
            <option value="Dezember">Dezember</option>
        </select>
    </div>
    
    <div class="kontostand-box">
        Monatsbudget: <span id="gesamtBudget">0.00</span> €
    </div>
    <br>

    <div class="eingabe-box">
        <label for="typ">Art der Buchung:</label>
        <select id="typ">
            <option value="einnahme">Einnahme (+)</option>
            <option value="ausgabe">Ausgabe (-)</option>
        </select>

        <label for="beschreibung">Beschreibung:</label>
        <input type="text" id="beschreibung" placeholder="z.B. Gehalt, Miete, Einkauf">

        <label for="betrag">Betrag in Euro:</label>
        <input type="number" id="betrag" step="0.01" placeholder="0.00">
        
        <div class="checkbox-container">
            <input type="checkbox" id="vorkasse">
            <label for="vorkasse">In Vorkasse (Noch nicht final abgebucht)</label>
        </div>
        
        <button type="button" onclick="speichereEintrag()">Eintrag Speichern</button>
    </div>

    <div class="tabellen-container">
        
        <div class="tabellen-spalte spalte-plus">
            <h3>Einnahmen (+)</h3>
            <table id="tabellePlus">
                <thead>
                    <tr>
                        <th>Beschreibung</th>
                        <th>Betrag</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="tabellen-spalte spalte-minus">
            <h3>Ausgaben (-)</h3>
            <table id="tabelleMinus">
                <thead>
                    <tr>
                        <th>Beschreibung</th>
                        <th>Betrag</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

    <script>
        if (sessionStorage.getItem('istEingeloggt') !== 'true') {
            alert('Zugriff verweigert! Bitte melde dich zuerst an.');
            window.location.href = 'index.html';
        }

        let alleBuchungen = [];

        function speichereEintrag() {
            let monat = document.getElementById('anzeigeMonat').value;
            let typ = document.getElementById('typ').value;
            let beschreibungInput = document.getElementById('beschreibung').value.trim();
            let betrag = parseFloat(document.getElementById('betrag').value);
            let istVorkasse = document.getElementById('vorkasse').checked;

            if (!beschreibungInput) {
                alert('Bitte gib eine Beschreibung ein.');
                return;
            }
            if (isNaN(betrag) || betrag <= 0) {
                alert('Bitte gib einen gültigen Betrag ein.');
                return;
            }

            let bestehenderEintrag = null;
            for (let i = 0; i < alleBuchungen.length; i++) {
                if (alleBuchungen[i].monat === monat && 
                    alleBuchungen[i].typ === typ && 
                    alleBuchungen[i].beschreibung.toLowerCase() === beschreibungInput.toLowerCase()) {
                    bestehenderEintrag = alleBuchungen[i];
                    break;
                }
            }

            if (bestehenderEintrag) {
                bestehenderEintrag.betrag = betrag;
                bestehenderEintrag.vorkasse = istVorkasse;
            } else {
                let neueBuchung = {
                    id: Date.now(),
                    monat: monat,
                    typ: typ,
                    beschreibung: beschreibungInput,
                    betrag: betrag,
                    vorkasse: istVorkasse
                };
                alleBuchungen.push(neueBuchung);
            }

            document.getElementById('beschreibung').value = "";
            document.getElementById('betrag').value = "";
            document.getElementById('vorkasse').checked = false;
            
            rendereTabelle();
        }

        function loescheEintrag(id) {
            alleBuchungen = alleBuchungen.filter(b => b.id !== id);
            rendereTabelle();
        }

        function verbucheEintrag(id) {
            for (let i = 0; i < alleBuchungen.length; i++) {
                if (alleBuchungen[i].id === id) {
                    alleBuchungen[i].vorkasse = false;
                    break;
                }
            }
            rendereTabelle();
        }

        function aktualisiereBeschreibung(id, neuerText) {
            for (let i = 0; i < alleBuchungen.length; i++) {
                if (alleBuchungen[i].id === id) {
                    alleBuchungen[i].beschreibung = neuerText;
                    break;
                }
            }
            aktualisiereBudgetAusrechnung();
        }

        function aktualisiereBudgetAusrechnung() {
            let aktiverMonat = document.getElementById('anzeigeMonat').value;
            let monatsBudget = 0.00;
            for (let i = 0; i < alleBuchungen.length; i++) {
                if (alleBuchungen[i].monat === aktiverMonat) {
                    if (alleBuchungen[i].typ === "einnahme") {
                        monatsBudget += alleBuchungen[i].betrag;
                    } else {
                        monatsBudget -= alleBuchungen[i].betrag;
                    }
                }
            }
            document.getElementById('gesamtBudget').innerText = monatsBudget.toFixed(2);
        }

        function rendereTabelle() {
            let aktiverMonat = document.getElementById('anzeigeMonat').value;
            
            let tbodyPlus = document.getElementById('tabellePlus').getElementsByTagName('tbody')[0];
            let tbodyMinus = document.getElementById('tabelleMinus').getElementsByTagName('tbody')[0];
            
            tbodyPlus.innerHTML = "";
            tbodyMinus.innerHTML = "";

            for (let i = 0; i < alleBuchungen.length; i++) {
                let b = alleBuchungen[i];

                if (b.monat === aktiverMonat) {
                    let zielTbody = (b.typ === "einnahme") ? tbodyPlus : tbodyMinus;
                    let neueZeile = zielTbody.insertRow();

                    if (b.vorkasse) {
                        neueZeile.className = "vorkasse-zeile";
                    }

                    let zelleBeschreibung = neueZeile.insertCell(0);
                    let zelleBetrag = neueZeile.insertCell(1);
                    let zelleAktion = neueZeile.insertCell(2);

                    let vorkasseHinweis = b.vorkasse ? '<span class="vorkasse-text">[In Vorkasse]</span>' : '';
                    zelleBeschreibung.innerHTML = '<input type="text" class="edit-input" value="' + b.beschreibung + '" oninput="aktualisiereBeschreibung(' + b.id + ', this.value)">' + vorkasseHinweis;

                    if (b.typ === "einnahme") {
                        zelleBetrag.innerText = "+ " + b.betrag.toFixed(2) + " €";
                        zelleBetrag.className = "plus";
                    } else {
                        zelleBetrag.innerText = "- " + b.betrag.toFixed(2) + " €";
                        zelleBetrag.className = "minus";
                    }

                    let aktionsButtons = "";
                    if (b.vorkasse) {
                        aktionsButtons += '<button class="btn-confirm" onclick="verbucheEintrag(' + b.id + ')">Buchen</button>';
                    }
                    aktionsButtons += '<button class="btn-delete" onclick="loescheEintrag(' + b.id + ')">X</button>';
                    
                    zelleAktion.innerHTML = aktionsButtons;
                }
            }
            aktualisiereBudgetAusrechnung();
        }
    </script>

</body>
</html>
